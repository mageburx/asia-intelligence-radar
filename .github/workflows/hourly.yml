name: Asia Intelligence Radar
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'docs/index.html']
permissions:
  contents: write
concurrency:
  group: asia-radar-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Recolher e traduzir
        env:
          TARGET_LANG: ${{ vars.TARGET_LANG || 'pt' }}
          MAX_TRANSLATIONS: '40'
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python -m asia_radar.collector
      - name: Gerar dashboard
        if: always()
        run: python -m asia_radar.report
      - name: Guardar histórico
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/articles.json data/status.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'data: update Asia Intelligence Radar'
            git push
          fi
